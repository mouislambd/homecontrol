services:
  - type: web
    name: smart-home-controller-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: FRONTEND_ORIGIN
        value: https://homecontrol-app.vercel.app
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO_DATA
        sync: false
